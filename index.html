<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 2: MindAR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <p id="message" style="position: fixed; top: 0; left: 0; z-index: 10; background: white; padding: 12px;" hidden></p>
  <!-- MindAR запускает камеру и ищет изображение из targets.mind. -->
  <a-scene
    mindar-image="imageTargetSrc: ../assets/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="horse" src="../assets/Horse.glb"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 2" position="1 2 2"></a-entity>
    <!-- targetIndex: 0 - первое изображение в файле targets.mind. -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#horse"
        position="0 -0.25 0.1"
        rotation="0 90 0"
        scale="0.65 0.65 0.65">
      </a-gltf-model>
    </a-entity>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    const message = document.querySelector('#message');
    // MindAR оставляет загрузку на экране, если доступ к камере запрещён.
    scene.addEventListener('arError', () => {
      scene.systems['mindar-image-system'].ui.hideLoading();
      message.hidden = false;
      message.textContent = 'Нет доступа к камере. Открой страницу через HTTPS в Chrome или Safari, разреши камеру и обнови страницу.';
    });
  </script>
</body>
</html>
